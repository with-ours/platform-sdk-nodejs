name: Publish NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string
      commit:
        description: Full release commit SHA already merged into main
        required: true
        type: string
  pull_request:
    types: [closed]

permissions: {}

jobs:
  # Starts this workflow on the default branch when a release PR merges.
  dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.title, 'release: ')
    name: dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${PR_TITLE#release: }"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-npm.yml/dispatches" \
            -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[version]=$RELEASE_VERSION" \
            -f "inputs[commit]=$RELEASE_COMMIT"
          echo "Dispatched publish-npm.yml on $DEFAULT_BRANCH for $RELEASE_VERSION at $RELEASE_COMMIT"

  # Validates the release and builds the package tarball.
  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version and commit
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${INPUT_VERSION#v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic release version" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full release commit SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          git checkout --quiet --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RELEASE_VERSION"
          TAG="v${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      # Same build and package contents as bin/publish-npm.
      - name: Build and pack
        id: pack
        run: |
          set -euo pipefail
          pnpm build
          pack_dir="$RUNNER_TEMP/package"
          mkdir "$pack_dir"
          (cd dist && pnpm pack --pack-destination "$pack_dir")
          shopt -s nullglob
          tarballs=("$pack_dir"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"
          echo "tarball=$(basename "${tarballs[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  # Publishes the built package, then tags and creates the GitHub Release.
  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
      RELEASE_COMMIT: ${{ needs.package.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.package.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check existing npm publication
        id: npm_release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(version, process.env.RELEASE_VERSION);
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            assert(response.ok, `npm lookup failed: ${response.status}`);
            const metadata = await response.json();
            assert.equal(metadata.name, name);
            assert.equal(metadata.version, version);
            const attestationUrl = metadata.dist?.attestations?.url;
            assert(attestationUrl?.startsWith('https://registry.npmjs.org/-/npm/v1/attestations/'), 'Existing package needs npm provenance before recovery');
            const attestationResponse = await fetch(attestationUrl);
            assert(attestationResponse.ok, `npm provenance lookup failed: ${attestationResponse.status}`);
            const { attestations } = await attestationResponse.json();
            const provenance = attestations
              .filter((entry) => entry.predicateType === 'https://slsa.dev/provenance/v1')
              .map((entry) => JSON.parse(Buffer.from(entry.bundle.dsseEnvelope.payload, 'base64').toString('utf8')));
            const integrity = metadata.dist.integrity;
            const matches = provenance.some((entry) =>
              entry.subject?.some((subject) =>
                `sha512-${Buffer.from(subject.digest.sha512, 'hex').toString('base64')}` === integrity) &&
              entry.predicate?.buildDefinition?.resolvedDependencies?.some((dependency) =>
                dependency.uri.startsWith(`git+https://github.com/${process.env.GITHUB_REPOSITORY}@`) &&
                dependency.digest.gitCommit === process.env.RELEASE_COMMIT));
            assert(matches, 'Existing npm package was not built from the requested release commit');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
            console.log(`${name}@${version} already published from ${process.env.RELEASE_COMMIT}`);
          }
          JS

      - name: Download package
        if: steps.npm_release.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Verify package checksum
        if: steps.npm_release.outputs.published != 'true'
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.package.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$TARBALL_SHA256  $TARBALL" | sha256sum --check --strict

      # Uses the same dist-tag as bin/publish-npm.
      - name: Publish to NPM
        if: steps.npm_release.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/package
        env:
          TARBALL_NAME: ${{ needs.package.outputs.tarball }}
        run: |
          set -euo pipefail
          MANIFEST="$(tar -xzOf "$TARBALL_NAME" package/package.json)"
          PACKAGE_NAME="$(jq -r -e '.name' <<<"$MANIFEST")"
          VERSION="$(jq -r -e '.version' <<<"$MANIFEST")"
          test "$PACKAGE_NAME" = "$(jq -r -e '.name' "$GITHUB_WORKSPACE/package.json")"
          test "$VERSION" = "$RELEASE_VERSION"

          NPM_INFO="$(npm view "$PACKAGE_NAME" version --json 2>/dev/null || true)"
          if echo "$NPM_INFO" | jq -e '.error.code == "E404"' > /dev/null 2>&1; then
            LAST_VERSION=""
          elif echo "$NPM_INFO" | jq -e '.error' > /dev/null 2>&1; then
            echo "ERROR: npm returned unexpected data:"
            echo "$NPM_INFO"
            exit 1
          else
            LAST_VERSION=$(echo "$NPM_INFO" | jq -r '.')
          fi

          CURRENT_IS_PRERELEASE=false
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CURRENT_IS_PRERELEASE=true
            CURRENT_TAG="${BASH_REMATCH[1]}"
          fi
          LAST_IS_STABLE_RELEASE=true
          if [[ -z "$LAST_VERSION" || "$LAST_VERSION" =~ -([a-zA-Z]+) ]]; then
            LAST_IS_STABLE_RELEASE=false
          fi
          if $CURRENT_IS_PRERELEASE && $LAST_IS_STABLE_RELEASE; then
            TAG="$CURRENT_TAG"
          else
            TAG="latest"
          fi

          npm publish --ignore-scripts "./$TARBALL_NAME" --tag "$TAG" --provenance

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$RELEASE_COMMIT" --generate-notes --title "$TAG"
          fi
